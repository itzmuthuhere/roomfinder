spring:
  application:
    name: roomfinder-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roomfinder}
    username: ${DB_USER:roomfinder}
    password: ${DB_PASSWORD:localdev}
  jpa:
    hibernate:
      ddl-auto: validate       # schema comes from Flyway, never from Hibernate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger

media:
  # Local disk in dev; an object-storage implementation replaces this later.
  root: ${MEDIA_ROOT:./data/media}
