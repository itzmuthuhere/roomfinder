spring:
  application:
    name: roomfinder-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roomfinder}
    username: ${DB_USER:roomfinder}
    password: ${DB_PASSWORD:localdev}
  jpa:
    hibernate:
      ddl-auto: validate       # schema comes from Flyway, never from Hibernate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger

media:
  # Local disk in dev; an object-storage implementation replaces this later.
  root: ${MEDIA_ROOT:./data/media}

auth:
  # Dev-only fallback, same pattern as spring.datasource.password above. Every real deployment
  # must set AUTH_JWT_SECRET to a random value at least 32 bytes long - JwtService refuses to
  # start otherwise.
  jwt-secret: ${AUTH_JWT_SECRET:dev-only-jwt-secret-change-me-before-any-real-deploy-32bytes}

otp:
  provider: ${OTP_PROVIDER:log}   # log (dev default, prints the code) or msg91 (real SMS)
  msg91:
    auth-key: ${MSG91_AUTH_KEY:}
    template-id: ${MSG91_TEMPLATE_ID:}
