name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is covered by release.yml

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      # Testcontainers starts its own PostGIS container; the runner already has Docker.
      - name: Test
        run: cd api && ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: app/package-lock.json }
      - run: cd app && npm ci
      - run: cd app && npm run build   # tsc -b && vite build

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for f in deploy/*.sh; do bash -n "$f"; done
      - name: Compose file parses
        run: |
          IMAGE_REPO=ghcr.io/example IMAGE_TAG=ci DB_PASSWORD=x AUTH_JWT_SECRET=x OTP_PROVIDER=log DOMAIN=example.com \
            docker compose -f deploy/docker-compose.prod.yml config > /dev/null
      - name: Caddyfile validates
        run: |
          docker run --rm -e DOMAIN=example.com -v "$PWD/app/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
