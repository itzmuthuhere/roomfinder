site_name: RoomFinder Docs
site_description: Product, API, schema and operations documentation
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc: { permalink: true }
nav:
  - Home: index.md
  - Product:
      - Overview: product/overview.md
      - Product context: product/PRODUCT.md
      - Product definition: product/product-definition.md
      - Architecture: ARCHITECTURE.md
      - Decisions (ADR): adr/index.md
  - Business:
      - Field validation: business/validation.md
      - Metrics: business/metrics.md
  - Features: features/index.md
  - API:
      - Reference: api/index.md
      - Conventions: api/conventions.md
  - Database:
      - Schema: schema/index.md
      - Bed state machine: schema/bed-state-machine.md
  - Frontend:
      - Screens: frontend/screens.md
      - State and data fetching: frontend/state.md
  - Operations:
      - Environments: ops/environments.md
      - Local setup: ops/local-setup.md
      - Secrets and keys: ops/secrets.md
      - Deployment: ops/deployment.md
      - Runbook: ops/runbook.md
